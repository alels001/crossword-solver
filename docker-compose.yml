services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    volumes: ["llm-cache:/app/.cache"]
    restart: unless-stopped

  ui:
    build: .
    command: ["streamlit", "run", "/app/apps/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports: ["8501:8501"]
    env_file: [.env]
    volumes: ["llm-cache:/app/.cache"]
    depends_on: [api]
    healthcheck:
      disable: true

volumes:
  llm-cache:
