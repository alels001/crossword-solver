name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      CWS_LLM_PROVIDER: fake   # tests never call paid APIs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,api,mcp]"
      - name: Lint
        run: ruff check src tests eval tools
      - name: Format check
        run: ruff format --check src tests eval tools
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest --cov --cov-report=term-missing
      - name: Offline evaluation smoke run
        run: python -m eval.run_eval

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t crossword-solver:ci .
      - name: Smoke test container
        run: |
          docker run -d --name cws -p 8000:8000 crossword-solver:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/healthz && break; sleep 1; done
          curl -fsS -X POST localhost:8000/v1/candidates -H 'content-type: application/json' \
            -d '{"clue":"Papageienart","length":3}'
          docker rm -f cws
